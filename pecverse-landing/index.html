<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PECverse — The All-in-One App for PEC Students</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Official campus utility app for Punjab Engineering College students. Check your live timetable, track 75% attendance, check hostel mess menus, and download class notes.">
    <meta name="keywords" content="PEC, Punjab Engineering College, PECverse, PEC Chandigarh, PEC Timetable, PEC Attendance, PEC Mess Menu, PEC Notes">
    <meta name="theme-color" content="#030712">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="PECverse — All-in-One App for PEC Students">
    <meta property="og:description" content="Check your live timetable, track attendance, check mess menus, and download study notes.">
    <meta property="og:image" content="./assets/logo.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./assets/logo.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Outfit:wght@600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#030712',
                            darker: '#010409',
                            card: 'rgba(15, 23, 42, 0.72)',
                            cardElevated: 'rgba(30, 41, 59, 0.88)',
                            cyan: '#00F0FF',
                            blue: '#3B82F6',
                            indigo: '#6366F1',
                            border: 'rgba(255, 255, 255, 0.08)',
                            glow: 'rgba(0, 240, 255, 0.25)',
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    animation: {
                        'float-slow': 'float 7s ease-in-out infinite',
                        'float-reverse': 'floatRev 8s ease-in-out infinite',
                        'pulse-glow': 'pulseGlow 5s ease-in-out infinite',
                        'spin-slow': 'spin 25s linear infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-12px)' },
                        },
                        floatRev: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(12px)' },
                        },
                        pulseGlow: {
                            '0%, 100%': { opacity: '0.3', transform: 'scale(1)' },
                            '50%': { opacity: '0.65', transform: 'scale(1.08)' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- React 18 & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            background-color: #030712;
            color: #E2E8F0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            perspective: 1200px;
        }

        /* Interactive Particle Background Canvas */
        #particle-canvas {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 1;
            opacity: 0.75;
        }

        .ambient-mesh {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 0;
            pointer-events: none;
            background: 
                radial-gradient(circle at 10% 10%, rgba(0, 240, 255, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 90% 20%, rgba(99, 102, 241, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 50% 85%, rgba(16, 185, 129, 0.06) 0%, transparent 55%),
                #030712;
        }

        .grid-bg {
            background-size: 36px 36px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        }

        /* Glassmorphic 3D Cards */
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .glass-card-interactive:hover {
            border-color: rgba(0, 240, 255, 0.35);
            transform: translateY(-4px);
            box-shadow: 0 25px 50px -15px rgba(0, 240, 255, 0.15);
        }

        /* Realistic 3D Titanium Phone Frame */
        .phone-stage {
            perspective: 1200px;
            transform-style: preserve-3d;
        }

        .phone-3d-wrapper {
            transition: transform 0.2s cubic-bezier(0.2, 0, 0.2, 1);
            transform-style: preserve-3d;
            will-change: transform;
        }

        .phone-body {
            width: 310px;
            height: 635px;
            background: #090D16;
            border-radius: 48px;
            box-shadow: 
                0 0 0 3px #1E293B,
                0 0 0 7px #0F172A,
                0 30px 80px rgba(0, 0, 0, 0.85),
                0 0 100px rgba(0, 240, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.14);
            overflow: hidden;
            position: relative;
            transform: translateZ(20px);
        }

        .phone-island {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 86px;
            height: 23px;
            background: #000000;
            border-radius: 12px;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 8px;
        }

        .phone-lens {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #111827;
            border: 1.5px solid #1F2937;
        }

        /* 3D Floating Badges */
        .floating-badge {
            transform-style: preserve-3d;
            transition: transform 0.3s ease;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        /* Mouse highlight follower */
        .glow-spotlight {
            position: absolute;
            inset: -1px;
            border-radius: inherit;
            background: radial-gradient(400px circle at var(--mouse-x, 0px) var(--mouse-y, 0px), rgba(0, 240, 255, 0.1), transparent 70%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .glass-card-interactive:hover .glow-spotlight {
            opacity: 1;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 7px; }
        ::-webkit-scrollbar-track { background: #030712; }
        ::-webkit-scrollbar-thumb { background: #1E293B; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #00F0FF; }
    </style>
</head>
<body class="relative min-h-screen text-slate-200 antialiased selection:bg-cyan-500 selection:text-black">

    <div class="ambient-mesh"></div>
    <div class="fixed inset-0 grid-bg pointer-events-none z-0"></div>
    <canvas id="particle-canvas"></canvas>

    <div id="root" class="relative z-10"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=in.edu.pec.connect";

        const SCREENS = [
            {
                id: 'timetable',
                title: 'Timetable',
                label: 'Dynamic Timetable',
                badge: 'Live Shifts',
                description: 'Pre-seeded for all branches. Updates automatically when classes shift rooms or get cancelled.',
                image: './assets/screenshots/screen-timetable.png',
                icon: 'calendar-days',
                color: 'from-cyan-500/20 to-blue-500/20',
                annotation: 'Next: EXN301 (L-24)'
            },
            {
                id: 'attendance',
                title: 'Attendance',
                label: '75% Attendance Guard',
                badge: 'Target 75%',
                description: 'Track present and missed classes. Calculates your exact margin to comfortably maintain the mandatory 75% requirement.',
                image: './assets/screenshots/screen-attendance.png',
                icon: 'pie-chart',
                color: 'from-emerald-500/20 to-teal-500/20',
                annotation: '81.4% • Goal Met'
            },
            {
                id: 'dashboard',
                title: 'Dashboard',
                label: 'Daily Schedule',
                badge: 'Today Hub',
                description: 'Live countdown to your next lecture, today’s hostel mess menu, and academic calendar.',
                image: './assets/screenshots/screen-dashboard.png',
                icon: 'layout-dashboard',
                color: 'from-indigo-500/20 to-purple-500/20',
                annotation: 'Countdown: 24m'
            },
            {
                id: 'mess',
                title: 'Mess Menu',
                label: 'Hostel Mess Menu',
                badge: 'Daily Food',
                description: 'Daily breakfast, lunch, snacks, and dinner menus for Aravali and campus hostels.',
                image: './assets/screenshots/screen-mess.png',
                icon: 'utensils',
                color: 'from-amber-500/20 to-orange-500/20',
                annotation: 'Lunch: Rajma Chawal'
            },
            {
                id: 'profile',
                title: 'Notes & Community',
                label: 'Notes & Campus Wall',
                badge: 'Resources',
                description: 'Download class notes and PYQs uploaded by CRs, or post lost & found items across campus.',
                image: './assets/screenshots/screen-profile.png',
                icon: 'book-open',
                color: 'from-rose-500/20 to-pink-500/20',
                annotation: '14 New Lecture PDFs'
            }
        ];

        const BRANCH_LIST = [
            { code: 'CSE', name: 'Computer Science', preview: '4 Classes Today • Data Structures (L-20)' },
            { code: 'AI', name: 'Artificial Intelligence', preview: '3 Classes Today • Machine Learning (T-19)' },
            { code: 'DS', name: 'Data Science', preview: '4 Classes Today • Stats & Probability (L-24)' },
            { code: 'ECE', name: 'Electronics & Comm.', preview: '5 Classes Today • Digital Electronics (L-23)' },
            { code: 'VLSI', name: 'VLSI Design', preview: '4 Classes Today • Semiconductor Devices (Lab-2)' },
            { code: 'EE', name: 'Electrical Engineering', preview: '4 Classes Today • Circuit Theory (L-6)' },
            { code: 'MECH', name: 'Mechanical Engg.', preview: '4 Classes Today • Thermodynamics (L-7)' },
            { code: 'CIVIL', name: 'Civil Engineering', preview: '3 Classes Today • Fluid Mechanics (L-12)' },
            { code: 'AERO', name: 'Aerospace Engineering', preview: '4 Classes Today • Aerodynamics (Audi)' },
        ];

        const FAQS = [
            {
                q: "Where do I install PECverse for Android?",
                a: "You can download and install PECverse directly from the official Google Play Store. It is 100% verified, ad-free, and safe."
            },
            {
                q: "When will the iOS version be released?",
                a: "The iOS version is complete and undergoing Apple App Store review. You can enter your email to get a direct TestFlight / App Store notification on launch day."
            },
            {
                q: "How does the 75% Attendance Guard work?",
                a: "You log your attended and missed lectures. The app calculates whether your aggregate satisfies the 75% college requirement and indicates how many classes you can afford to miss or need to attend."
            },
            {
                q: "How are room shifts and class cancellations updated?",
                a: "Verified Class Representatives (CRs) log single-day changes. When you open the app, your daily schedule updates automatically without altering your weekly timetable."
            },
            {
                q: "Are all 1st-year groups and branches supported?",
                a: "Yes! Schedules for all 1st Year groups (G1 to G12) and 2nd/3rd/4th Year branches (CSE, AI, DS, ECE, VLSI, EE, MECH, CIVIL, AERO) are already built-in."
            }
        ];

        function App() {
            const [activeScreenIndex, setActiveScreenIndex] = useState(0);
            const [isIosModalOpen, setIsIosModalOpen] = useState(false);
            const [iosEmail, setIosEmail] = useState('');
            const [iosSubmitted, setIosSubmitted] = useState(false);
            const [openFaqIndex, setOpenFaqIndex] = useState(0);
            const [selectedBranch, setSelectedBranch] = useState(BRANCH_LIST[0]);

            // Interactive 3D Tilt State for Phone
            const [tilt, setTilt] = useState({ x: 0, y: 0 });
            const stageRef = useRef(null);

            // Attendance Calculator State
            const [attended, setAttended] = useState(26);
            const [total, setTotal] = useState(32);

            const percent = useMemo(() => {
                if (total <= 0) return 100;
                return Math.round((attended / total) * 100);
            }, [attended, total]);

            const calculationResult = useMemo(() => {
                if (percent >= 75) {
                    const margin = Math.max(0, Math.floor((attended / 0.75) - total));
                    return {
                        isSafe: true,
                        text: `You have ${percent}% attendance. You have a margin of ${margin} ${margin === 1 ? 'class' : 'classes'} while staying at or above the 75% requirement.`
                    };
                } else {
                    const required = Math.max(1, Math.ceil((0.75 * total - attended) / 0.25));
                    return {
                        isSafe: false,
                        text: `Attendance is ${percent}%. You must attend the next ${required} consecutive ${required === 1 ? 'class' : 'classes'} without absence to reach 75%.`
                    };
                }
            }, [attended, total, percent]);

            // Mouse parallax tilt handler
            const handleMouseMove = (e) => {
                if (!stageRef.current) return;
                const rect = stageRef.current.getBoundingClientRect();
                const x = e.clientX - rect.left - rect.width / 2;
                const y = e.clientY - rect.top - rect.height / 2;
                // Clamp rotation
                const rotateX = Math.max(-14, Math.min(14, (-y / rect.height) * 25));
                const rotateY = Math.max(-14, Math.min(14, (x / rect.width) * 25));
                setTilt({ x: rotateX, y: rotateY });
            };

            const handleMouseLeave = () => {
                setTilt({ x: 0, y: 0 });
            };

            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            const activeScreen = SCREENS[activeScreenIndex];

            return (
                <div className="min-h-screen flex flex-col font-sans">
                    
                    {/* Header */}
                    <header className="fixed top-0 left-0 right-0 z-50 px-5 py-4">
                        <div className="max-w-6xl mx-auto flex items-center justify-between px-6 py-3 rounded-2xl glass-card border border-white/10 shadow-2xl backdrop-blur-2xl">
                            <a href="#" className="flex items-center gap-3 group">
                                <div className="relative">
                                    <div className="absolute -inset-1 bg-gradient-to-r from-cyan-400 to-indigo-500 rounded-xl blur opacity-75 group-hover:opacity-100 transition duration-300"></div>
                                    <img src="./assets/logo.png" alt="PECverse Logo" className="relative w-9 h-9 rounded-xl object-cover" />
                                </div>
                                <span className="font-display font-extrabold text-xl tracking-tight text-white flex items-center gap-1">
                                    PEC<span className="text-cyan-400">verse</span>
                                </span>
                            </a>

                            <div className="hidden md:flex items-center gap-8 text-sm font-semibold text-slate-300">
                                <a href="#features" className="hover:text-cyan-400 transition-colors">Features</a>
                                <a href="#showcase" className="hover:text-cyan-400 transition-colors">App Tour</a>
                                <a href="#calculator" className="hover:text-cyan-400 transition-colors">Attendance Planner</a>
                                <a href="#branches" className="hover:text-cyan-400 transition-colors">Branches</a>
                                <a href="#faq" className="hover:text-cyan-400 transition-colors">FAQ</a>
                            </div>

                            <div className="flex items-center gap-3">
                                <a 
                                    href={PLAY_STORE_URL}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="px-4 py-2.5 rounded-xl bg-gradient-to-r from-cyan-400 to-blue-500 hover:from-cyan-300 hover:to-blue-400 text-slate-950 font-extrabold text-xs sm:text-sm transition-all flex items-center gap-2 shadow-lg shadow-cyan-500/25 transform hover:scale-105 active:scale-95"
                                >
                                    <i data-lucide="play" className="w-4 h-4 fill-slate-950"></i>
                                    <span>Get on Google Play</span>
                                </a>
                            </div>
                        </div>
                    </header>

                    {/* Hero Section with 3D Spatial Layout */}
                    <section className="pt-36 pb-20 md:pt-44 md:pb-28 px-6 max-w-6xl mx-auto w-full text-center flex flex-col items-center relative">
                        
                        <div className="inline-flex items-center gap-2.5 px-4 py-1.5 rounded-full bg-cyan-950/70 border border-cyan-500/30 text-cyan-300 text-xs font-semibold mb-6 shadow-lg shadow-cyan-950/40">
                            <span className="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
                            Live on Google Play Store for Punjab Engineering College
                        </div>

                        <h1 className="text-4xl sm:text-6xl md:text-7xl font-display font-black text-white tracking-tight leading-[1.08] max-w-4xl mb-6">
                            The All-in-One App for <br className="hidden sm:block" />
                            <span className="bg-gradient-to-r from-cyan-400 via-sky-300 to-indigo-400 bg-clip-text text-transparent">PEC Students.</span>
                        </h1>

                        <p className="text-base sm:text-lg text-slate-300 max-w-2xl mb-10 leading-relaxed font-normal">
                            Check your live timetable with room shift updates, calculate attendance so you stay safely above 75%, view today’s hostel mess menu, and download class notes.
                        </p>

                        {/* CTA Buttons */}
                        <div className="flex flex-col sm:flex-row items-center justify-center gap-4 w-full max-w-md mb-14">
                            
                            {/* Google Play Button */}
                            <a
                                href={PLAY_STORE_URL}
                                target="_blank"
                                rel="noopener noreferrer"
                                className="w-full sm:w-auto px-7 py-4 rounded-2xl bg-white hover:bg-slate-100 text-slate-950 font-extrabold text-sm flex items-center justify-center gap-3 transition-all shadow-xl shadow-white/10 transform hover:-translate-y-1 active:translate-y-0"
                            >
                                <svg className="w-5 h-5 text-slate-950" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M3.609 1.814L13.792 12 3.61 22.186a1.597 1.597 0 0 1-.61-.926V2.74c0-.36.108-.696.61-.926zm11.598 11.601L12.44 16.18l6.398 3.702-3.631-6.467zm0-2.83l3.631-6.468-6.398 3.702 2.767 2.766zm1.415 1.415l4.316 2.5a1.2 1.2 0 0 0 0-2.083l-4.316-2.5 1.01 2.083z"/>
                                </svg>
                                <div className="text-left">
                                    <div className="text-[10px] uppercase font-semibold text-slate-600 leading-tight">GET IT ON</div>
                                    <div className="text-sm font-black text-slate-950 leading-tight">Google Play</div>
                                </div>
                            </a>

                            {/* iOS Waitlist */}
                            <button
                                onClick={() => setIsIosModalOpen(true)}
                                className="w-full sm:w-auto px-7 py-4 rounded-2xl glass-card hover:bg-slate-800/80 border border-white/15 text-white text-sm font-semibold flex items-center justify-center gap-3 transition-all transform hover:-translate-y-1 active:translate-y-0"
                            >
                                <i data-lucide="apple" className="w-5 h-5 text-slate-300"></i>
                                <div className="text-left">
                                    <div className="text-[10px] uppercase font-semibold text-slate-400 leading-tight">App Store</div>
                                    <div className="text-sm font-bold text-white leading-tight">iOS (Coming Soon)</div>
                                </div>
                            </button>

                        </div>

                        {/* Badges */}
                        <div className="flex flex-wrap justify-center gap-3 text-xs text-slate-400">
                            <span className="px-4 py-2 rounded-xl bg-slate-900/80 border border-white/10 flex items-center gap-2 shadow-sm">
                                <i data-lucide="check" className="w-4 h-4 text-cyan-400"></i>
                                All 9 PEC Branches Covered
                            </span>
                            <span className="px-4 py-2 rounded-xl bg-slate-900/80 border border-white/10 flex items-center gap-2 shadow-sm">
                                <i data-lucide="check" className="w-4 h-4 text-cyan-400"></i>
                                100% Ad-Free & Fast
                            </span>
                            <span className="px-4 py-2 rounded-xl bg-slate-900/80 border border-white/10 flex items-center gap-2 shadow-sm">
                                <i data-lucide="check" className="w-4 h-4 text-cyan-400"></i>
                                Real-Time Room Shift Sync
                            </span>
                        </div>

                    </section>

                    {/* Interactive 3D Phone Showcase with Spatial Badges */}
                    <section 
                        id="showcase" 
                        ref={stageRef}
                        onMouseMove={handleMouseMove}
                        onMouseLeave={handleMouseLeave}
                        className="py-20 px-6 max-w-6xl mx-auto w-full phone-stage relative"
                    >
                        <div className="text-center mb-14">
                            <span className="text-cyan-400 text-xs uppercase font-bold tracking-wider block mb-2">Interactive Preview</span>
                            <h2 className="text-3xl sm:text-4xl font-display font-extrabold text-white mb-3">
                                See PECverse in Action
                            </h2>
                            <p className="text-slate-400 text-sm sm:text-base max-w-xl mx-auto">
                                Move your mouse to explore the 3D phone and tap any feature tab to switch screens.
                            </p>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-10 items-center">
                            
                            {/* Left Switcher Tabs */}
                            <div className="lg:col-span-6 space-y-3">
                                {SCREENS.map((screen, idx) => {
                                    const isActive = idx === activeScreenIndex;
                                    return (
                                        <div
                                            key={screen.id}
                                            onClick={() => setActiveScreenIndex(idx)}
                                            className={`p-5 rounded-2xl cursor-pointer transition-all border ${
                                                isActive 
                                                    ? 'bg-slate-900/90 border-cyan-500/60 shadow-xl shadow-cyan-500/10 text-white translate-x-2' 
                                                    : 'glass-card hover:bg-slate-900/60 border-white/5 text-slate-400 opacity-70 hover:opacity-100'
                                            }`}
                                        >
                                            <div className="flex items-center justify-between mb-1.5">
                                                <div className="flex items-center gap-3.5">
                                                    <div className={`p-2 rounded-xl ${isActive ? 'bg-cyan-500/20 text-cyan-400 border border-cyan-500/30' : 'bg-slate-800 text-slate-400'}`}>
                                                        <i data-lucide={screen.icon} className="w-5 h-5"></i>
                                                    </div>
                                                    <h3 className={`font-bold text-base ${isActive ? 'text-white' : 'text-slate-300'}`}>
                                                        {screen.label}
                                                    </h3>
                                                </div>
                                                <span className={`text-[10px] font-bold uppercase px-2 py-0.5 rounded-full ${
                                                    isActive ? 'bg-cyan-400 text-slate-950' : 'bg-slate-800 text-slate-400'
                                                }`}>
                                                    {screen.badge}
                                                </span>
                                            </div>
                                            <p className="text-xs sm:text-sm text-slate-400 pl-11">
                                                {screen.description}
                                            </p>
                                        </div>
                                    );
                                })}
                            </div>

                            {/* Right 3D Spatial Phone & Floating Badges */}
                            <div className="lg:col-span-6 flex flex-col items-center justify-center relative min-h-[660px]">
                                
                                {/* Ambient Glow */}
                                <div className="absolute w-72 h-96 bg-cyan-500/20 rounded-full blur-3xl pointer-events-none animate-pulse-glow"></div>

                                {/* 3D Phone with Gyroscopic Parallax */}
                                <div 
                                    className="phone-3d-wrapper relative"
                                    style={{

        // Particle Canvas Background Script
        function initParticles() {
            const canvas = document.getElementById('particle-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let w = canvas.width = window.innerWidth;
            let h = canvas.height = window.innerHeight;

            const particles = [];
            const count = Math.min(45, Math.floor(w / 35));

            for (let i = 0; i < count; i++) {
                particles.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    vx: (Math.random() - 0.5) * 0.4,
                    vy: (Math.random() - 0.5) * 0.4,
                    radius: Math.random() * 1.6 + 0.6,
                    color: i % 3 === 0 ? 'rgba(0, 240, 255, ' : 'rgba(99, 102, 241, ',
                    alpha: Math.random() * 0.5 + 0.2
                });
            }

            function animate() {
                ctx.clearRect(0, 0, w, h);
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;

                    if (p.x < 0) p.x = w;
                    if (p.x > w) p.x = 0;
                    if (p.y < 0) p.y = h;
                    if (p.y > h) p.y = 0;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color + p.alpha + ')';
                    ctx.fill();
                });
                requestAnimationFrame(animate);
            }
            animate();

            window.addEventListener('resize', () => {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            });
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        window.addEventListener('load', initParticles);
